<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masks Off</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0a3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Masks Off">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column per screen, with a fixed Game / Chats bar along the bottom.
   One committed look: a candlelit hall, deep emerald ground, parchment text, gold for action. */
:root{
  --bg:#0a3b2c; --bg-night:#031a12; --surface:#0f4a38; --surface-2:#165a45; --line:#2f7a60;
  --fg:#f6f1e1; --muted:#b4d4c4; --brass:#e2b94b; --brass-ink:#1a1405; --wine:#ff8396; --sage:#8fe3b4;
  --font-display:'Bodoni Moda','Didot','Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .6s;-webkit-tap-highlight-color:transparent}
body.has-nav{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
body[data-night]{background:var(--bg-night)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:36rem;margin-inline:auto;padding-block:1rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
#splash{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;transition:opacity .4s;
  /* the picture's top edge colours carry on upward, so a tall screen stays seamless and the cloak is never stretched */
  background:linear-gradient(to right,#796518,#816c1a,#88711b,#8b741a,#8c751b,#8c741b,#87711a,#806b19,#7a671a)}
#splash.out{opacity:0;pointer-events:none}
#splash img{display:block;width:100%;max-width:640px;height:auto;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%);mask-image:linear-gradient(to bottom,transparent 0,#000 16%)}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:700;font-size:1.35rem;color:var(--brass)}
.brand svg{display:block}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:.75rem;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.card.host{border-style:dashed;border-color:var(--brass)}
.card.deathrow{border-color:var(--wine)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem} h2{font-size:1.4rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.say{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.5rem}
.say .text{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.4rem;line-height:1.3;text-wrap:pretty}
.code{font-family:var(--font-mono);font-size:3rem;letter-spacing:.3em;color:var(--brass);padding-left:.3em}
.btn{min-height:46px;padding:.6rem 1.1rem;border-radius:8px;border:1px solid var(--brass);background:var(--brass);color:var(--brass-ink);font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;color:var(--wine);border-color:var(--wine)}
.btn.small{min-height:36px;padding:.3rem .7rem;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:.35rem}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;min-height:46px;width:100%}
input[type=text]:disabled{opacity:.5}
input.codein{font-family:var(--font-mono);font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:.92rem}
.chip.me{border-color:var(--brass)}
.chip.dead{color:var(--muted);border-style:dashed;background:transparent}
.chip.dead .nm{text-decoration:line-through}
.chip.shield{border-color:var(--sage)}
.chip.row{border-color:var(--wine)}
.tag{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.tag.t{color:var(--wine)} .tag.f{color:var(--sage)} .tag.s{color:var(--sage)}
.grid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr))}
.pick{min-height:56px;padding:.5rem .75rem;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;font-weight:500;overflow-wrap:anywhere}
.pk{display:flex;align-items:center;gap:.5rem}
.pick:hover{border-color:var(--muted)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.pick[aria-pressed=true]{border-color:var(--brass);background:rgba(226,185,75,.2);box-shadow:inset 0 0 0 1px var(--brass)}
.pick.murder[aria-pressed=true]{border-color:var(--wine);background:rgba(255,131,150,.2);box-shadow:inset 0 0 0 1px var(--wine)}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:.75rem;align-items:center;padding:.5rem .1rem;border-bottom:1px solid var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.nm{overflow-wrap:anywhere;min-width:0}
.pot{font-family:var(--font-mono);font-size:2.2rem;color:var(--brass);font-variant-numeric:tabular-nums}
.timer{font-family:var(--font-mono);font-size:2.2rem;color:var(--brass);font-variant-numeric:tabular-nums}
.peek{width:100%;min-height:150px;border-radius:10px;border:1px dashed var(--brass);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1rem;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.peek .big{font-family:var(--font-display);font-size:2.2rem;font-weight:700}
.peek.t{border-color:var(--wine)} .peek.t .big{color:var(--wine)}
.peek.f{border-color:var(--sage)} .peek.f .big{color:var(--sage)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass)}
.ok{color:var(--sage)} .bad{color:var(--wine)}
.night{text-align:center;padding-block:3rem;background:transparent;border-color:var(--line)}
.night h2{color:var(--muted)}
.notice{background:rgba(226,185,75,.12);border:1px solid var(--brass);border-radius:10px;padding:.8rem 1rem}
.dot{display:inline-block;min-width:1.25rem;padding:0 .4rem;border-radius:999px;background:var(--wine);color:#fff;font-size:.75rem;line-height:1.25rem;text-align:center;font-weight:700}

/* bottom bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:.5rem 16px calc(.5rem + env(safe-area-inset-bottom,0px));transition:background .6s}
body[data-night] .nav{background:var(--bg-night)}
.navin{max-width:36rem;margin-inline:auto;display:flex;gap:.5rem}
.navbtn{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:.5rem}
.navbtn[aria-selected=true]{border-color:var(--brass);color:var(--brass)}

/* chats */
.chead{display:flex;align-items:center;gap:.75rem;min-width:0}
.chead .ctitles{min-width:0;flex:1}
.chead h3{overflow-wrap:anywhere}
.crow{display:flex;flex-direction:column;gap:.2rem;text-align:left;width:100%;padding:.7rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.crow:hover{border-color:var(--muted)}
.ctop{display:flex;align-items:center;gap:.5rem;min-width:0}
.cname{overflow-wrap:anywhere;min-width:0;flex:1}
.cprev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{display:flex;flex-direction:column;gap:.2rem;height:calc(100vh - 17rem);height:calc(100dvh - 17rem);min-height:12rem;overflow-y:auto;padding:.25rem}
.mrow{display:flex;align-items:flex-end;gap:.4rem;max-width:100%}
.mrow.mine{justify-content:flex-end}
.mrow .av,.mrow .avsp{flex:none}
.mcol{display:flex;flex-direction:column;min-width:0;max-width:78%}
.mrow.mine .mcol{align-items:flex-end}
.msg{background:#e6e8e7;color:#111;border-radius:18px;padding:.45rem .8rem;overflow-wrap:anywhere;width:fit-content}
.msg.mine{background:#17825b;color:#fff}
.mname{font-size:.66rem;color:var(--muted);margin:.1rem .5rem 0;line-height:1.2}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-style:italic;text-align:center;font-size:.9rem;padding:.1rem .4rem}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;background:var(--brass);color:var(--brass-ink);font-weight:700;overflow:hidden;flex:none}
.photo{display:flex;align-items:center;gap:.8rem}
.photobtn{width:84px;height:84px;border-radius:50%;border:2px dashed var(--brass);background:var(--surface-2);color:var(--brass);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:.4rem;cursor:pointer;font-size:.75rem;line-height:1.2;font-weight:700;text-align:center;flex:none}
.photobtn img{width:100%;height:100%;object-fit:cover;display:block}
.compose{display:flex;gap:.5rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-weight:500;z-index:5}
body.has-nav .toast{bottom:calc(5.75rem + env(safe-area-inset-bottom,0px))}

/* full-screen moments: voting, reveals, roles. Same emerald, gold and serif as the rest of the app (deep wine for a Traitor) */
#full{position:fixed;inset:0;z-index:15}
.fs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 1.2rem) 1.2rem calc(env(safe-area-inset-bottom,0px) + 1rem);font-family:var(--font-display);overflow-y:auto;-webkit-tap-highlight-color:transparent}
.fs.g{background:var(--bg);color:var(--brass)}
.fs.r{background:#3a0f1a;color:var(--wine)}
.fsMain{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;text-align:center;margin:auto 0}
.fsMain.top{justify-content:flex-start;margin:0}
.fsT{font-size:clamp(2rem,9.5vw,3.2rem);line-height:1.2;margin:0;font-weight:700}
.fsBig{font-size:clamp(3.2rem,17vw,5.6rem);line-height:1.1;margin:0;font-weight:700}
.fsName{font-size:clamp(2.4rem,13vw,4rem);line-height:1.1;margin:0;font-weight:700;overflow-wrap:anywhere}
.fsSub{font-family:var(--font-body);font-size:1rem;color:var(--muted);margin:0}
.fs.r .fsSub{color:#e9a9b4}
.fsPhoto{display:flex;align-items:center;justify-content:center;width:min(64vw,300px);height:min(64vw,300px);border-radius:50%;object-fit:cover;background:var(--brass);color:var(--brass-ink);font-size:6rem;flex:none;overflow:hidden}
.fsPhoto.sm{width:min(36vw,150px);height:min(36vw,150px);font-size:3rem}
.fsRow{display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:center;align-items:flex-start}
.fsRow>div{display:flex;flex-direction:column;align-items:center;gap:.4rem;max-width:44vw}
.fsGrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%;max-width:480px}
.fsPill{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:.4rem .8rem;font:inherit;font-size:1.35rem;font-weight:700;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:64px;cursor:pointer;overflow-wrap:anywhere}
.fsPill{flex-wrap:wrap}
.fsPill:disabled{opacity:.45;cursor:default}
.vmov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.vmwin{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:1rem;width:100%;max-width:520px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:.7rem}
.vmlist{display:flex;flex-direction:column;gap:.4rem}
.vmlist .pick{text-align:left}
.fsTag{width:100%;text-align:center;font-size:.7rem;opacity:.85;font-weight:400}
.fs.r .fsPill{background:#52182a;border-color:#8a3248;color:var(--fg)}
.fs.r .fsPill.on{border-color:var(--wine);background:#6e2338;box-shadow:inset 0 0 0 1px var(--wine)}
.fsPill.on{border-color:var(--brass);background:rgba(226,185,75,.2);box-shadow:inset 0 0 0 1px var(--brass)}
.fsPill .fsAv{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--brass);color:var(--brass-ink);font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.fsBtn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:10px;font-family:var(--font-body);font-weight:700;font-size:1.1rem;padding:.9rem 1.6rem;width:100%;max-width:420px;cursor:pointer}
.fsBtn:disabled{opacity:.4;cursor:not-allowed}
.fs.r .fsBtn{background:var(--wine);color:#3a0f1a}
.fsFoot{width:100%;display:flex;flex-direction:column;align-items:center;gap:.6rem;padding-top:.8rem}
.fsLinks{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.fsLink{background:transparent;border:1px solid currentColor;color:inherit;opacity:.8;border-radius:999px;padding:.4rem .9rem;font-family:var(--font-body);font-size:.85rem;cursor:pointer}
.fsTapAll{flex:1;width:100%;background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:0}
/* the crop window for profile photos */
.cropov{position:fixed;inset:0;z-index:30;background:rgba(2,20,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem}
.cropwin{position:relative;width:280px;height:280px;touch-action:none;border-radius:6px;overflow:hidden;background:#000}
.cropwin canvas{display:block;width:280px;height:280px}
.cropwin .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(2,20,12,.72);border:2px solid var(--brass);pointer-events:none}
.cropov input[type=range]{width:280px}
@media (prefers-reduced-motion:reduce){body,.nav{transition:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="/icons/cloak.jpg" alt=""></div>
<div id="full" hidden></div>
<div class="wrap">
  <div class="top">
    <div class="brand"><span id="logo"></span>Masks Off</div>
    <div class="row"><button id="voiceBtn" class="btn ghost small" hidden>Host voice: off</button><button id="leaveBtn" class="btn ghost small" hidden>Leave</button></div>
  </div>
  <main id="game" class="stack"></main>
  <section id="chats" class="stack" hidden>
    <div id="chatlist" class="stack"></div>
    <div id="chatnew" class="stack" hidden></div>
    <div id="chatconv" class="stack" hidden>
      <div class="chead">
        <button id="cback" class="btn ghost small">‹ Chats</button>
        <div class="ctitles"><h3 id="ctitle"></h3><p id="csub" class="muted small"></p></div>
      </div>
      <div id="msgs" class="msgs" role="log" aria-live="polite"></div>
      <p id="cnote" class="muted small"></p>
      <div class="compose">
        <input id="cin" type="text" maxlength="300" autocomplete="off" placeholder="Message" enterkeyhint="send" aria-label="Message">
        <button id="csend" class="btn">Send</button>
      </div>
    </div>
  </section>
</div>
<nav id="nav" class="nav" aria-label="Main" hidden>
  <div class="navin">
    <button id="nav-game" class="navbtn" aria-selected="true">Game</button>
    <button id="nav-chats" class="navbtn" aria-selected="false">Chats <span id="nav-dot" class="dot" hidden></span></button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function el(tag,props){
  var n=document.createElement(tag);
  if(props)for(var k in props){var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);}
  var kids=[].slice.call(arguments,2);
  (function add(a){a.forEach(function(c){if(c==null||c===false)return;if(Array.isArray(c))return add(c);n.append(c.nodeType?c:document.createTextNode(String(c)));});})(kids);
  return n;
}
var CLOAK='<img src="/icons/icon-192.png" width="30" height="30" alt="" style="display:block;border-radius:7px">';
$('#logo').innerHTML=CLOAK;

/* ---------- photos ---------- */
function avatar(id,size){
  var p=S.V&&S.V.players.find(function(x){return x.id===id;});size=size||28;
  var st='width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.45)+'px';
  if(p&&p.pic)return el('img',{class:'av',style:st,alt:'',loading:'lazy',src:'/api/photo?code='+encodeURIComponent(S.code)+'&token='+encodeURIComponent(S.token)+'&id='+encodeURIComponent(id)});
  return el('span',{class:'av',style:st,'aria-hidden':'true'},(p?p.name:'?').slice(0,1).toUpperCase());
}
function cropPhoto(file){
  // shows the picture in a round window. The player drags to move it and uses the slider to zoom, then we keep what is inside the circle.
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('That photo could not be read.'));};
    img.onload=function(){
      var D=280,w=img.naturalWidth,h=img.naturalHeight,s0=D/Math.min(w,h),z=1,cx=w/2,cy=h/2;
      var cv=el('canvas',{width:D,height:D}),ctx=cv.getContext('2d');
      var zoom=el('input',{type:'range',min:'1',max:'4',step:'0.01',value:'1','aria-label':'Zoom'});
      function clamp(){var sc=s0*z;cx=Math.max(D/2/sc,Math.min(w-D/2/sc,cx));cy=Math.max(D/2/sc,Math.min(h-D/2/sc,cy));}
      function draw(c,size){var sc=s0*z*size/D;c.fillStyle='#000';c.fillRect(0,0,size,size);c.drawImage(img,size/2-cx*sc,size/2-cy*sc,w*sc,h*sc);}
      function paint(){clamp();draw(ctx,D);}
      var pts={},last=null,lastDist=0;
      var win=el('div',{class:'cropwin'},cv,el('div',{class:'ring'}));
      win.addEventListener('pointerdown',function(e){win.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];last=null;});
      win.addEventListener('pointermove',function(e){
        if(!pts[e.pointerId])return;
        var ids=Object.keys(pts);pts[e.pointerId]=[e.clientX,e.clientY];
        if(ids.length>=2){ // two fingers: pinch to zoom
          var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
          if(lastDist){z=Math.max(1,Math.min(4,z*d/lastDist));zoom.value=String(z);}
          lastDist=d;paint();return;
        }
        if(last){var sc=s0*z;cx-=(e.clientX-last[0])/sc;cy-=(e.clientY-last[1])/sc;paint();}
        last=[e.clientX,e.clientY];
      });
      function up(e){delete pts[e.pointerId];last=null;lastDist=0;}

/* ---------- chats ----------
   The server sends the list of chats this phone may read inside the game state (chatPost).
   The messages themselves are loaded from /api/chats, then arrive one by one as "msg" events. */
function mergeMsgs(a,b){
  var seen={},out=[];
  a.concat(b).forEach(function(m){if(!seen[m.n]){seen[m.n]=1;out.push(m);}});
  out.sort(function(x,y){return x.n-y.n;});
  return out.slice(-300);
}
function fetchChats(){
  if(!S.code||!S.token||S.fetching)return;
  S.fetching=true;
  fetch('/api/chats?code='+encodeURIComponent(S.code)+'&token='+encodeURIComponent(S.token))
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      S.fetching=false;
      if(!S.code)return;
      if(j){
        var next={};
        j.chats.forEach(function(c){var cur=S.chats[c.id];next[c.id]=Object.assign({},c,{msgs:mergeMsgs(cur?cur.msgs:[],c.msgs)});});
        S.chats=next;
      }
      if(S.pendingOpen){
        if(S.chats[S.pendingOpen]){var id=S.pendingOpen;S.pendingOpen=null;openChat(id);return;}
        if(S.pendingTries++<5)setTimeout(fetchChats,400);else S.pendingOpen=null;
      }
      chatsChanged();
    })
    .catch(function(){S.fetching=false;});
}
function syncChats(){
  var ids=Object.keys((S.V&&S.V.chatPost)||{});
  if(ids.some(function(id){return !S.chats[id];}))fetchChats(); // a chat appeared (a new group, the Traitors chat, the dead chat)
  var gone=Object.keys(S.chats).filter(function(id){return ids.indexOf(id)<0;});
  if(gone.length){ // a chat closed because we were taken out of it
    gone.forEach(function(id){delete S.chats[id];});
    if(S.chatView&&S.chatView!=='new'&&!S.chats[S.chatView])S.chatView=null;
    chatsChanged();
  }
}
function onMsg(cid,m){
  var c=S.chats[cid];
  if(!c){fetchChats();return;}
  c.msgs=mergeMsgs(c.msgs,[m]);
  chatsChanged();
}
function chatsChanged(){if(S.tab==='chats')renderChats();else renderNav();}
function unreadIn(c){
  var r=S.read[c.id]||0,me=S.V.you.id;
  return c.msgs.filter(function(m){return m.n>r&&m.from!==me;}).length;
}
function unreadTotal(){
  if(!S.V)return 0;
  return Object.keys(S.chats).reduce(function(s,id){return s+unreadIn(S.chats[id]);},0);
}
function markRead(cid){
  var c=S.chats[cid];if(!c||!c.msgs.length)return;
  var last=c.msgs[c.msgs.length-1].n;
  if((S.read[cid]||0)<last){S.read[cid]=last;store('mo-read-'+S.code,JSON.stringify(S.read));}
}
function chatTitle(c){
  if(c.kind==='all')return 'Table chat';
  if(c.kind==='traitors')return 'Traitors';
  if(c.kind==='dead')return 'The dead';
  if(c.name)return c.name;
  var me=S.V.you.id,o=c.members.filter(function(id){return id!==me;}).map(nick);
  return o.join(', ')||'Chat';
}
function chatSub(c){
  if(c.kind==='all')return 'Everyone in the game can read this';
  if(c.kind==='traitors')return 'Only Traitors can see this. A recruit appears here when they accept.';
  if(c.kind==='dead')return 'Only banished and murdered players can see this';
  var me=S.V.you.id;
  return (c.side==='dead'?'Dead chat. ':'')+'In this chat: '+c.members.map(function(id){return id===me?'you':nick(id);}).join(', ');
}
function chatTag(c){
  if(c.kind==='all')return 'Everyone';
  if(c.kind==='traitors')return 'Traitors only';
  if(c.kind==='dead')return 'Dead only';
  var base=c.members.length===2?'Direct':'Group';
  return c.side==='dead'?base+' · dead':base;
}
function postHint(c){
  if(c.kind==='all')return 'Banished and murdered players can read this chat but not post.';
  if(c.kind==='traitors')return 'Only living Traitors can post here.';
  if(c.kind==='dead')return 'Only banished and murdered players can post here.';
  return 'You are out of the game, so you can read this chat but no longer post in it.';
}
function lastN(c){return c.msgs.length?c.msgs[c.msgs.length-1].n:0;}
function renderChatList(){
  var v=S.V,box=$('#chatlist');
  var order={all:0,traitors:1,dead:2};
  var cs=Object.keys(S.chats).map(function(id){return S.chats[id];});
  cs.sort(function(a,b){
    var pa=order[a.kind],pb=order[b.kind];
    if(pa!==undefined||pb!==undefined)return (pa===undefined?9:pa)-(pb===undefined?9:pb);
    return lastN(b)-lastN(a);
  });
  var rows=cs.map(function(c){
    var last=c.msgs.length?c.msgs[c.msgs.length-1]:null,un=unreadIn(c);
    var prev=last?((last.sys?'':(last.from===v.you.id?'You':(last.name||'Someone'))+': ')+last.text):'No messages yet';
    var other=(c.kind==='private'&&c.members.length===2)?c.members.filter(function(id){return id!==v.you.id;})[0]:null;
    return el('button',{class:'crow',onclick:function(){openChat(c.id);}},
      el('div',{class:'ctop'},other?avatar(other,26):null,el('strong',{class:'cname',text:chatTitle(c)}),el('span',{class:'tag muted',text:chatTag(c)}),un?el('span',{class:'dot',text:String(un)}):null),
      el('div',{class:'cprev muted small',text:prev}));
  });
  var hasPrivate=cs.some(function(c){return c.kind==='private';});
  box.replaceChildren.apply(box,[
    el('div',{class:'row between'},el('h2',{text:'Chats'}),S.V.you.alive?B('New chat',function(){S.chatView='new';S.newSel=[];renderChats();},'small'):el('span'))
  ].concat(rows,[
    (hasPrivate||!S.V.you.alive)?null:el('p',{class:'muted small',text:'Start a direct message or a group with New chat. Only the people you pick can see it.'})
  ]).filter(Boolean));
}
function renderNewChat(){
  var v=S.V,me=v.you,box=$('#chatnew'),old=$('#cnname'),nameVal=old?old.value:'';
  var eligible=v.players.filter(function(p){return p.id!==me.id&&p.alive===me.alive;});
  S.newSel=S.newSel.filter(function(id){return eligible.some(function(p){return p.id===id;});});
  var lobby=v.phase==='lobby',n=S.newSel.length;
  var kind=n===1?'Start direct message':n>1?'Start group chat ('+(n+1)+' people)':'Start chat';
  var intro=lobby?'Private chats open once the game starts.'
    :me.alive?'Pick one player for a direct message, or several for a group. Only the people you pick will ever see it.'
    :'You are out of the game, so you can only start chats with other banished and murdered players.';
  box.replaceChildren(
    el('div',{class:'chead'},B('‹ Chats',function(){S.chatView=null;renderChats();},'ghost small'),el('div',{class:'ctitles'},el('h3',{text:'New chat'}))),
    card(el('p',{class:'muted',text:intro}),
      eligible.length?el('div',{class:'grid'},eligible.map(function(p){
        var on=S.newSel.indexOf(p.id)>=0;
        return el('button',{class:'pick','aria-pressed':String(on),disabled:lobby,onclick:function(){
          var i=S.newSel.indexOf(p.id);if(i>=0)S.newSel.splice(i,1);else S.newSel.push(p.id);renderNewChat();}},el('span',{class:'pk'},avatar(p.id,28),p.name));}))
        :el('p',{class:'muted',text:'There is nobody to chat with yet.'}),
      n>1?el('div',{class:'field'},el('label',{for:'cnname',class:'label',text:'Group name (optional)'}),
        el('input',{id:'cnname',type:'text',maxlength:'24',autocomplete:'off',value:nameVal})):null,
      B(kind,function(){
        var nm=$('#cnname')?$('#cnname').value:'';
        act('newChat',{members:S.newSel.slice(),name:nm}).then(function(r){
          if(r&&r.chat){S.newSel=[];openWhenReady(r.chat);}});
      },'',lobby||n===0)));
}
function openWhenReady(cid){
  if(S.chats[cid]){openChat(cid);return;}
  S.pendingOpen=cid;S.pendingTries=0;fetchChats();
}
function msgNode(m,i,list,c){
  if(m.sys)return el('div',{class:'msg sys',text:m.text});
  var me=S.V.you.id,mine=m.from===me,nxt=list[i+1];
  var last=!nxt||nxt.sys||nxt.from!==m.from; // the last message in a run from one person
  var many=c.kind!=='private'||c.members.length>2; // names only matter when more than two people could be talking
  var col=el('div',{class:'mcol'},el('div',{class:'msg'+(mine?' mine':''),text:m.text}),
    (!mine&&last&&many)?el('div',{class:'mname',text:m.name||nick(m.from)}):null);
  if(mine)return el('div',{class:'mrow mine'},col);
  return el('div',{class:'mrow'},last?avatar(m.from,30):el('span',{class:'avsp',style:'width:30px'}),col);
}
function renderConv(){
  var v=S.V,c=S.chats[S.chatView];if(!c)return;
  $('#ctitle').textContent=chatTitle(c);
  $('#csub').textContent=chatSub(c);
  var box=$('#msgs'),near=S.stick||box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.replaceChildren.apply(box,c.msgs.map(function(m,i,l){return msgNode(m,i,l,c);}));
  if(near)box.scrollTop=box.scrollHeight;
  S.stick=false;
  var can=!!v.chatPost[c.id];
  $('#cin').disabled=!can;$('#csend').disabled=!can;
  $('#cin').placeholder=can?'Message':'You can read but not post';
  $('#cnote').textContent=can?'':postHint(c);
  if(!document.hidden)markRead(c.id);
  renderNav();
}
function renderChats(){
  var v=S.V;if(!v)return;
  if(S.chatView&&S.chatView!=='new'&&!S.chats[S.chatView])S.chatView=null;
  var conv=S.chatView&&S.chatView!=='new';
  $('#chatlist').hidden=S.chatView!==null;
  $('#chatnew').hidden=S.chatView!=='new';
  $('#chatconv').hidden=!conv;
  if(S.chatView===null)renderChatList();
  else if(S.chatView==='new')renderNewChat();
  else renderConv();
  renderNav();
}
function saveDraft(){if(S.chatView&&S.chatView!=='new')S.drafts[S.chatView]=$('#cin').value;}
function openChat(cid){
  saveDraft();
  S.chatView=cid;S.stick=true;S.tab='chats';
  $('#cin').value=S.drafts[cid]||'';
  showTab();
}
function sendMsg(){
  var inp=$('#cin'),t=inp.value.trim(),cid=S.chatView;
  if(!t||!cid||cid==='new')return;
  inp.value='';S.drafts[cid]='';
  act('chat',{cid:cid,text:t}).then(function(r){if(!r&&S.chatView===cid&&!inp.value)inp.value=t;});
}
$('#csend').addEventListener('click',sendMsg);
$('#cin').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendMsg();}});
$('#cback').addEventListener('click',function(){saveDraft();S.chatView=null;renderChats();});

function renderNav(){
  var nav=$('#nav');
  if(!S.V){nav.hidden=true;return;}
  nav.hidden=false;
  $('#nav-game').setAttribute('aria-selected',String(S.tab==='game'));
  $('#nav-chats').setAttribute('aria-selected',String(S.tab==='chats'));
  var n=unreadTotal(),d=$('#nav-dot');
  d.hidden=!n;d.textContent=n>99?'99+':String(n);

function showTab(){
  if(!S.V)S.tab='game';
  $('#game').hidden=S.tab!=='game';
  $('#chats').hidden=S.tab!=='chats';
  document.body.classList.toggle('has-nav',!!S.V);
  if(S.tab==='chats')renderChats();else renderNav();
  renderFull();
}
$('#nav-game').addEventListener('click',function(){saveDraft();S.tab='game';showTab();window.scrollTo(0,0);});

function tapScreen(text,fn){return fsScreen('g',[el('button',{class:'fsTapAll',onclick:fn},fsText(text))],[]);}
function watchScreen(title,sub){return fsScreen('g',[fsText(title),sub?el('p',{class:'fsSub',text:sub}):null],[]);}
function hostBtn(label,fn){return el('button',{class:'fsLink',onclick:fn},label);}
function fullScreen(v){
  var me=v.you,P=v.phase,host=me.host,mates=(v.mates||[]).filter(function(id){return id!==me.id;}).map(nick);
  // your own role: tap to see it, in private
  if(me.role&&((P==='roles'&&S.roleOpen&&!pl(me.id).ready)||Date.now()<S.peekUntil)&&P!=='lobby'&&P!=='ended'){
    return roleScreen(me.role,me.role==='traitor'?mates:null,function(){
      if(P==='roles'&&S.roleOpen){S.roleOpen=false;act('ready');}else S.peekUntil=0;
      rebuild();});
  }
  if(P==='banish'){
    var b=v.ban,canVote=me.alive&&b.voters.indexOf(me.id)>=0,voted=b.voted.indexOf(me.id)>=0;

        el('div',{class:'fsGrid'},ids.map(function(id){
          return el('button',{class:'fsPill'+(S.pending===id?' on':''),onclick:function(){S.pending=id;rebuild();}},pillFace(id),nick(id));}))],
        [el('button',{class:'fsBtn',disabled:!S.pending,onclick:function(){act('vote',{target:S.pending});}},'Lock in my vote'),count,closeBtn],{top:true});
    }
    if(voted)return fsScreen('g',[fsText('Your vote is locked in'),el('p',{class:'fsSub',text:'Waiting for the others'}),count],[closeBtn]);
    if(me.alive)return fsScreen('g',[fsText('You are tied'),el('p',{class:'fsSub',text:'The others are deciding between you'}),count],[closeBtn]);

    if(inQ&&!shown)return fsScreen('g',[el('button',{class:'fsTapAll',onclick:function(){act('revealVote');}},fsText('Tap to reveal your vote'))],[cnt,rf]);
    if(inQ&&shown)return fsScreen('g',[bigPhoto(r.mine),fsText(nick(r.mine),'fsName')],[cnt,rf]);
    return fsScreen('g',[fsText('The votes are being revealed')],[cnt,rf]);

    return fsScreen('g',[fsText('We have a tie between'),
      el('div',{class:'fsRow'},v.tie.ids.map(function(id){return el('div',null,bigPhoto(id,true),fsText(nick(id),'fsT'));})),
      el('p',{class:'fsSub',text:'Another vote is about to begin. The tied players cannot vote.'})],[]);
  }
  if(P==='banished'){

    if(ev.type!=='banished')return fsScreen('g',[fsText('No one is banished')],[cont]);
    if(ev.show&&ev.done)return fsScreen(ev.role==='traitor'?'r':'g',[fsText(ev.role==='traitor'?'Traitor':'Faithful','fsBig')],[cont]);
    var main=[fsText('The banished player is'),bigPhoto(ev.id),fsText(nick(ev.id),'fsName')];

  }
  if(P==='night'){
    var n=v.night||{},t=n.traitor,tm=(t&&t.traitors||[]);

    // the Traitors' red vote
    var isRow=t.kind==='row',mode=(t.recruitAllowed&&S.nightMode==='recruit')?'recruit':(isRow?'row':'murder');
    var mine=t.picks.find(function(x){return x.id===me.id;});

    var cands=v.players.filter(function(p){
      if(!p.alive)return false;
      if(mode==='row')return true;
      if(tm.indexOf(p.id)>=0)return false;
      return !(mode==='murder'&&t.rowIds&&t.rowIds.indexOf(p.id)<0);});
    var mineSel=mine&&mine.action===mode?(mode==='row'?mine.targets:[mine.target]):[];
    main.push(el('div',{class:'fsGrid'},cands.map(function(p){
      var on=mineSel.indexOf(p.id)>=0,others=pickersOf(p.id),shielded=mode==='murder'&&p.shield;
      return el('button',{class:'fsPill'+(on?' on':''),disabled:shielded,onclick:function(){
        if(mode==='row'){var s=mineSel.slice(),i=s.indexOf(p.id);if(i>=0)s.splice(i,1);else if(s.length<t.rowSize)s.push(p.id);else return;act('nightPick',{action:'row',targets:s});}
        else act('nightPick',{action:mode,target:p.id});}},
        pillFace(p.id),nick(p.id)+(p.id===me.id?' (you)':''),shielded?el('span',{class:'fsTag',text:'shield'}):null,others.length?el('span',{class:'fsTag',text:others.join(', ')+(others.length>1?' chose':' chose')}):null);})));
    var lockTxt=lockedMe?'Locked in. Waiting for the other Traitors':t.agreed?'Lock in':tm.length>1?'Waiting for all Traitors to pick the same':'Choose someone';
    return fsScreen('r',main,
      [t.recruitAllowed?el('button',{class:'fsBtn',onclick:function(){S.nightMode=mode==='recruit'?'murder':'recruit';rebuild();}},mode==='recruit'?(isRow?'Back to death row':'Back to murder'):'Choose to recruit'):null,
       el('button',{class:'fsBtn',disabled:lockedMe||!t.agreed,onclick:function(){act('nightLock');}},lockTxt),
       el('p',{class:'fsSub',text:t.locks.length+' of '+t.needed+' locked in. Change your pick any time before everyone locks.'})],{top:true});
  }
  if(P==='morning'){
    var ev2=v.event||{},hostGo=host?el('button',{class:'fsBtn',onclick:function(){act('beginDay');}},'Start day '+(v.round+1)):null;
    var tapMain=function(kids){
      if(host)return fsScreen('g',[el('button',{class:'fsTapAll',onclick:function(){act('revealMurder');}},kids,el('p',{class:'fsSub',text:'Host: tap the screen to reveal'}))],[]);
      return fsScreen('g',kids.concat([el('p',{class:'fsSub',text:'The host will reveal it'})]),[]);
    };
    if(ev2.type==='murdered'&&!ev2.revealed)return tapMain([fsText('There has been a murder!'),fsText('The person murdered is...','fsName')]);
    if(ev2.type==='deathrow'&&!ev2.revealed)return tapMain([fsText('The players put on death row are...','fsName')]);
    if(ev2.type==='murdered')return fsScreen('g',[fsText('The person murdered is'),bigPhoto(ev2.id),fsText(nick(ev2.id),'fsName')],[hostGo]);
    if(ev2.type==='deathrow')return fsScreen('g',[fsText('Death row'),
      el('div',{class:'fsRow'},ev2.ids.map(function(id){return el('div',null,bigPhoto(id,true),fsText(nick(id),'fsT'));})),
      el('p',{class:'fsSub',text:'The next murder will be one of them, unless a shield protects them.'})],[hostGo]);
    return fsScreen('g',[fsText('No murder tonight')],[hostGo]);
  }
  if(P==='final3'){
    var f=v.fin;
    if(!me.alive)return watchScreen('The final three decide','Watch quietly while they choose');
    if(f.mine)return fsScreen('g',[fsText('Your choice is locked in'),el('p',{class:'fsSub',text:f.count+' of '+f.ids.length+' have chosen'})],[]);
    var opts=[['end','End the game'],['vote','Vote one last time']];
    return fsScreen('g',[fsText('The final three'),
      el('p',{class:'fsSub',text:'End the game and, if a Traitor is among you, the Traitors win. Vote one last time and one of you leaves. If any one of you votes, the vote happens.'}),
      el('div',{class:'fsGrid'},opts.map(function(o){return el('button',{class:'fsPill'+(S.pending===o[0]?' on':''),onclick:function(){S.pending=o[0];rebuild();}},o[1]);}))],
      [el('button',{class:'fsBtn',disabled:!S.pending,onclick:function(){act('finalChoice',{choice:S.pending});}},'Lock in my choice'),
       el('p',{class:'fsSub',text:f.count+' of '+f.ids.length+' have chosen'})],{top:true});
  }
  if(P==='finalreveal'){
    var fr=v.fin,inF=fr.ids.indexOf(me.id)>=0,shownF=fr.revealed.indexOf(me.id)>=0;
    var fc=el('p',{class:'fsSub',text:fr.revealed.length+' of '+fr.ids.length+' choices shown'});
    var nf=fr.ids.filter(function(id){return fr.revealed.indexOf(id)<0;})[0];
    var ff=host&&nf?hostBtn('Show '+nick(nf)+'\'s choice for them',function(){act('revealFinalFor');}):null;
    if(inF&&!shownF)return fsScreen('g',[el('button',{class:'fsTapAll',onclick:function(){act('revealFinal');}},fsText('Tap to reveal your choice'))],[fc,ff]);
    if(inF&&shownF)return fsScreen('g',[bigPhoto(me.id),fsText(fr.mine==='end'?'End the game':'Vote one last time','fsName')],[fc,ff]);
    return fsScreen('g',[fsText('The final three are revealing their choices')],[fc,ff]);
  }
  if(P==='finalresult'){
    return fsScreen('g',[fsText(v.fin.outcome==='end'?'The game will end':'One last vote'),
      el('p',{class:'fsSub',text:v.fin.outcome==='end'?'All three of you chose to end it.':'At least one of you chose to vote.'})],[]);
  }
  if(P==='endreveal'){
    var er=v.er,inE=er.ids.indexOf(me.id)>=0,doneE=er.done.indexOf(me.id)>=0;
    var ef=host&&er.done.length<er.ids.length?hostBtn('Reveal the next role for them',function(){act('revealEndFor');}):null;
    if(inE&&!doneE)return fsScreen('g',[el('button',{class:'fsTapAll',onclick:function(){act('revealEnd');}},fsText('Tap to reveal your role'))],[ef]);
    if(inE&&doneE)return fsScreen(me.role==='traitor'?'r':'g',[fsText(me.role==='traitor'?'Traitor':'Faithful','fsBig'),el('p',{class:'fsSub',text:er.done.length+' of '+er.ids.length+' revealed'})],[ef]);
    return fsScreen('g',[fsText('The last players are revealing who they are'),el('p',{class:'fsSub',text:er.done.length+' of '+er.ids.length+' revealed'})],[ef]);
  }
  if(P==='ended'&&v.winner&&S.endSeen!==v.code){
    var tw=v.winner==='traitors';
    return fsScreen(tw?'r':'g',[fsText(tw?'Traitors win':'Faithful win','fsBig')],
      [el('button',{class:'fsBtn',onclick:function(){S.endSeen=v.code;rebuild();}},'See everyone\'s roles')]);
  }
  return null;
}
function renderFull(){
  var box=$('#full'),v=S.V,scr=(v&&S.tab==='game')?fullScreen(v):null;
  if(!scr){if(!box.hidden){box.hidden=true;box.replaceChildren();}S.fullKey='';document.body.classList.remove('fs-on');return;}
  var foot=scr.foot.slice();
  var links=[el('button',{class:'fsLink',onclick:function(){saveDraft();S.tab='chats';showTab();}},'Open chats')];
  if(v.you.host&&v.phase!=='ended')links.push(el('button',{class:'fsLink',onclick:function(){
    if(S.endArm){S.endArm=false;act('endEarly');return;}
    S.endArm=true;toast('Tap again to end the game for everyone.');setTimeout(function(){S.endArm=false;},4000);}},'End the game early'));
  if(!scr.onclick)foot.push(el('div',{class:'fsLinks'},links));
  var key=JSON.stringify(v)+'|'+S.pending+'|'+S.roleOpen+'|'+(Date.now()<S.peekUntil)+'|'+S.endSeen;
  if(key===S.fullKey&&!box.hidden)return;
  S.fullKey=key;
  var root=el('div',{class:'fs '+scr.theme},el('div',{class:'fsMain'+(scr.top?' top':'')},scr.main),el('div',{class:'fsFoot'},foot));
  if(scr.onclick)root.addEventListener('click',scr.onclick);
  box.replaceChildren(root);box.hidden=false;document.body.classList.add('fs-on');
}

/* ---------- render ---------- */
function rebuild(){S.lastKey='';S.fullKey='';renderGame();renderFull();}
function renderGame(){
  var g=$('#game'),v=S.V;
  if(!v&&S.code){
    var rk='rejoin';if(S.lastKey===rk)return;S.lastKey=rk;
    g.replaceChildren(card(el('h3',{text:'Getting you back to the table…'}),
      el('p',{class:'muted',text:'Your place in the game is saved. This only takes a moment.'}),
      B('Leave this game',function(){clearSession();},'ghost small')));
    return;
  }
  if(!v){
    if(S.lastKey==='landing')return;S.lastKey='landing';
    g.replaceChildren.apply(g,landing());return;
  }
  var key=JSON.stringify(v)+'|'+S.pending+'|'+S.rowSel.join(',')+'|'+S.nightMode+'|'+S.confirm+'|'+S.roleOpen+'|'+(Date.now()<S.peekUntil);
  if(key===S.lastKey)return;
  S.lastKey=key;
  // keep anything the host is typing when the screen redraws
  var keep={},act0=document.activeElement,fid=act0&&act0.id&&g.contains(act0)?act0.id:null,sel=null;
  g.querySelectorAll('input[id]').forEach(function(i){keep[i.id]=i.value;});
  if(fid&&act0.selectionStart!=null)sel=[act0.selectionStart,act0.selectionEnd];
  g.replaceChildren.apply(g,build().filter(Boolean));
  Object.keys(keep).forEach(function(id){var i=document.getElementById(id);if(i)i.value=keep[id];});
  if(fid){var f=document.getElementById(fid);if(f){f.focus();if(sel&&f.setSelectionRange){try{f.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
  tick();
}
function onState(){
  var v=S.V;
  if(v&&S.pk!==v.pk){S.pk=v.pk;S.pending=null;S.rowSel=[];S.confirm=null;S.lastKey='';}
  if(!v||v.phase!=='roles')S.roleOpen=false;
  document.body.toggleAttribute('data-night',!!(v&&v.phase==='night'));
  $('#leaveBtn').hidden=!v;
  $('#voiceBtn').hidden=!(v&&v.you.host);
  $('#voiceBtn').textContent='Host voice: '+(voiceOn()?'on':'off');
  if(v){
    syncChats();
    if(!S.sawNarr){S.sawNarr=true;S.spoken=v.narration&&v.narration.id;} // a refreshed page must not repeat the last line
    else if(v.narration&&v.narration.id!==S.spoken){S.spoken=v.narration.id;if(voiceOn()&&v.narration.talk&&v.phase!=='lobby')playLine(v.narration);}
  }
  renderGame();showTab();renderFull();
}
function tick(){
  document.querySelectorAll('[data-ends]').forEach(function(n){
    var s=Math.max(0,Math.round((+n.dataset.ends-Date.now())/1000));
    n.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  });
}
setInterval(tick,500);
$('#voiceBtn').addEventListener('click',voiceMenu);
$('#leaveBtn').addEventListener('click',function(){
  var inGame=S.V&&S.V.phase!=='lobby'&&S.V.phase!=='ended';
  if(inGame&&!S.leaveArmed){S.leaveArmed=true;toast('Tap Leave again to leave a game in progress. You will not be able to return.');setTimeout(function(){S.leaveArmed=false;},4000);return;}
  api('/api/leave',{code:S.code,token:S.token}).catch(function(){});
  clearSession();
});

// coming back to the page (screen woke, tab switched, signal returned) reconnects without any sign-in
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(S.code&&S.token)connect();
  if(S.tab==='chats'&&S.chatView&&S.chatView!=='new'){markRead(S.chatView);renderNav();}
});
window.addEventListener('online',function(){if(S.code&&S.token)connect();});
if(S.code&&S.token)connect();
onState();
// while a game is open, ping the server now and then so a free host does not put it to sleep
setInterval(function(){if(S.code&&S.token)fetch('/healthz',{cache:'no-store'}).catch(function(){});},240000);
var splashT0=Date.now();
function dropSplash(){
  var sp=$('#splash');if(!sp||sp.dataset.gone)return;sp.dataset.gone='1';
  setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.hidden=true;},450);},Math.max(0,1100-(Date.now()-splashT0)));
}
window.dropSplash=dropSplash;
if(S.code&&S.token){setTimeout(dropSplash,6000);}else dropSplash(); // with a saved game, wait for the first update
})();
</script>
</body>
